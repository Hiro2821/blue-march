<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3b9be6">
<title>ブルーマーチ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <!-- ゲーム中のHUD -->
  <div id="hud">
    <div id="hudTop">
      <div class="pill blue" id="hudArmy">
        <svg class="ico" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M6 16a10 10 0 0 1 20 0v3H6z" fill="#2f7df0" stroke="#0e3a8c" stroke-width="2"/>
          <rect x="4" y="17" width="24" height="4" rx="2" fill="#0e3a8c"/>
          <path d="M11 11q3-5 8-3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".7"/>
          <rect x="12" y="21" width="8" height="6" rx="2" fill="#f1c9a0" stroke="#0e3a8c" stroke-width="1.5"/>
        </svg>
        <b id="armyNum">10</b>
      </div>
      <div class="pill gold"><span class="coin"></span><b id="coinNum">0</b></div>
      <div class="pill stg"><b id="stageNum">STAGE 1</b></div>
    </div>
    <div id="prog"><i id="progFill"></i></div>
    <div id="typeRow"></div>
    <div id="buffRow"></div>
  </div>
  <button id="btnPause" class="hidden" aria-label="一時停止">❚❚</button>
  <div id="hint">◀ スワイプで左右に移動 ▶</div>
  <div id="toast"></div>

  <!-- メニュー（ホーム・ステージ・兵士・強化・ミッション・実績） -->
  <div id="menu" class="hidden">
    <header id="mhead">
      <div class="pill gold"><span class="coin"></span><b id="mCoin">0</b></div>
      <div id="mtitle">ホーム</div>
    </header>
    <main id="mbody"></main>
    <nav id="tabs">
      <button data-tab="home"><i>🏠</i><span>ホーム</span></button>
      <button data-tab="stages"><i>🗺️</i><span>ステージ</span></button>
      <button data-tab="soldiers"><i>🛡️</i><span>兵士</span></button>
      <button data-tab="upgrade"><i>🔨</i><span>強化</span></button>
      <button data-tab="missions"><i>📋</i><span>ミッション</span></button>
      <button data-tab="records"><i>🏅</i><span>実績</span></button>
    </nav>
  </div>

  <!-- 強化選択 -->
  <div class="overlay hidden" id="pick">
    <div class="panel">
      <div class="banner pickh">強化を選ぼう！</div>
      <div class="tip">このステージの間だけ有効です</div>
      <div id="pickList"></div>
    </div>
  </div>

  <!-- クリア -->
  <div class="overlay hidden" id="clear">
    <div class="panel">
      <div class="banner win">ステージクリア！</div>
      <div class="result">
        <div>残った兵士 <b id="clArmy">0</b> 人</div>
        <div id="clRows" class="rows"></div>
        <div class="reward"><span class="coin"></span> 合計 <b id="clReward">0</b></div>
        <div class="tip" id="clDetail"></div>
      </div>
      <button class="btn green big" id="btnNext">つぎのステージへ</button>
      <button class="btn plain" id="btnReplay">もう一度あそぶ</button>
      <button class="btn plain" id="btnClearHome">ホームへ</button>
    </div>
  </div>

  <!-- ゲームオーバー -->
  <div class="overlay hidden" id="over">
    <div class="panel">
      <div class="banner lose">全滅…</div>
      <div class="result">
        <div id="ovStage">ステージ 1</div>
        <div class="reward" id="ovReward"><span class="coin"></span> 参加報酬 <b id="ovCoins">0</b></div>
        <div class="tip">コインで兵士を強化すれば、きっと突破できる！</div>
      </div>
      <button class="btn green big" id="btnRetry">リトライ</button>
      <button class="btn gold wide" id="btnToUpgrade">🔨 兵士を強化する</button>
      <button class="btn plain" id="btnOverHome">ホームへ</button>
    </div>
  </div>

  <!-- 放置報酬 -->
  <div class="overlay hidden" id="idle">
    <div class="panel">
      <div class="banner pickh">おかえりなさい！</div>
      <div class="result">
        <div id="idTime">経過 0分</div>
        <div class="reward"><span class="coin"></span> 放置報酬 <b id="idCoins">0</b></div>
        <div class="tip" id="idNote"></div>
      </div>
      <button class="btn green big" id="btnIdleClaim">受け取る</button>
    </div>
  </div>

  <!-- 一時停止 -->
  <div class="overlay hidden" id="pause">
    <div class="panel">
      <div class="banner pickh">一時停止</div>
      <button class="btn green big" id="btnResume">つづける</button>
      <button class="btn plain" id="btnQuit">あきらめてホームへ</button>
      <div class="tip">あきらめると、このステージのコインは手に入りません</div>
    </div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/art.js"></script>
<script src="js/boss.js"></script>
<script src="js/stage.js"></script>
<script src="js/game.js"></script>
<script src="js/meta.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
